name: Release hub server

on:
  push:
    tags: ['hub-v*']

permissions:
  contents: read

concurrency:
  group: hub-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      commit: ${{ steps.ref.outputs.commit }}
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # Fetch tag objects and the full history of origin/main.
          persist-credentials: false
      - name: Validate pushed tag against main
        id: ref
        run: |
          tag=${GITHUB_REF#refs/tags/}
          if [[ $GITHUB_REF != refs/tags/* || ! $tag =~ ^hub-v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]]; then
            echo 'Expected a stable hub-vX.Y.Z tag' >&2
            exit 1
          fi
          commit=$(git rev-parse --verify "${GITHUB_REF}^{commit}")
          event_commit=$(git rev-parse --verify "${GITHUB_SHA}^{commit}")
          if [[ $commit != "$event_commit" || $commit != "$(git rev-parse HEAD)" ]]; then
            echo 'Pushed tag, event SHA, and checkout must resolve to the same commit' >&2
            exit 1
          fi
          # The repository should protect main and restrict hub-v* tags to trusted
          # maintainers: GitHub loads a tag-push workflow from the tagged commit.
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo 'Tagged commit is not on the fetched origin/main history' >&2
            exit 1
          fi
          printf 'tag=%s\ncommit=%s\n' "$tag" "$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test hub and plugin on production Node 22
        run: |
          npm --prefix apps/server test
          node --test packages/dsh-cross-device/test/*.test.js
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Test hub and plugin on Node 24
        run: |
          npm --prefix apps/server test
          node --test packages/dsh-cross-device/test/*.test.js
      - name: Test the hub release updater
        run: python3 -B scripts/test_pull_server_release.py
      - name: Build exact tested commit
        id: build
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.ref.outputs.commit }}
        run: |
          out="$RUNNER_TEMP/dsh-hub-release"
          bash scripts/build-server-release.sh "$RELEASE_TAG" "$RELEASE_COMMIT" "$out"
          digest=$(sha256sum "$out/dsh-hub-$RELEASE_TAG.tar.gz")
          printf 'sha256=%s\n' "${digest%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsh-hub-release
          path: ${{ runner.temp }}/dsh-hub-release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: check
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dsh-hub-release
          path: ${{ runner.temp }}/dsh-hub-release/
      - name: Verify assets and publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.check.outputs.commit }}
          RELEASE_SHA256: ${{ needs.check.outputs.sha256 }}
        run: |
          [[ $RELEASE_TAG =~ ^hub-v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]]
          [[ $RELEASE_COMMIT =~ ^[0-9a-f]{40}$ && $RELEASE_SHA256 =~ ^[0-9a-f]{64}$ ]]
          cd "$RUNNER_TEMP/dsh-hub-release"
          archive="dsh-hub-$RELEASE_TAG.tar.gz"
          checksums="dsh-hub-$RELEASE_TAG.sha256"
          printf '%s  %s\n' "$RELEASE_SHA256" "$archive" | cmp - "$checksums"
          sha256sum --check --strict "$checksums"

          # ls-remote exposes the peeled commit for annotated tags and the
          # direct object for lightweight tags. Fail if the tag moved/disappeared.
          ref="refs/tags/$RELEASE_TAG"
          refs=$(git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$ref" "$ref^{}")
          current_commit=$(awk -v ref="$ref" '$2 == ref {tag = $1} $2 == ref "^{}" {peeled = $1} END {print (peeled == "" ? tag : peeled)}' <<< "$refs")
          if [[ $current_commit != "$RELEASE_COMMIT" ]]; then
            echo 'Remote tag no longer points at the tested commit' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$archive" "$checksums" \
            --verify-tag --target "$RELEASE_COMMIT" --title "$RELEASE_TAG" --latest \
            --notes "Hub server built from commit $RELEASE_COMMIT."
