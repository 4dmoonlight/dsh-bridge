name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: relay tests
        working-directory: server
        run: npm test

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: swift build
        working-directory: apps/macos
        run: swift build
      - name: swift test
        working-directory: apps/macos
        run: swift test
